title: Site

tabs:
  pages:
    label: Seiten
    icon: page
    sections:
      pages:
        type: pages
        label: Seiten

  settings:
    label: Einstellungen
    icon: cog
    columns:
      left:
        width: 1/2
        sections:
          address:
            type: fields
            label: Adresse
            fields:
              company_name:
                label: Name Unternehmen
                type: text
                width: 3/3
              street:
                label: Straße
                type: text
                width: 2/3
              house_number:
                label: Hausnummer
                type: text
                width: 1/3
              zip:
                label: PLZ
                type: text
                width: 1/3
              city:
                label: Stadt
                type: text
                width: 2/3
          second_adress:
            type: fields
            label: Adresse Zweigstelle
            fields:
              street_second_adress:
                label: Straße
                type: text
                width: 2/3
              house_number_second_adress:
                label: Hausnummer
                type: text
                width: 1/3
              zip_second_adress:
                label: PLZ
                type: text
                width: 1/3
              city_second_adress:
                label: Stadt
                type: text
                width: 2/3
          other:
            type: fields
            label: Weiteres
            fields:
              tax_id:
                label: Umsatzsteuer ID
                type: text
                width: 3/3
              shareholder_one:
                label: 1. Gesellschafter
                type: text
                width: 1/3
              shareholder_two:
                label: 2. Gesellschafter
                type: text
                width: 2/3

      right:
        width: 1/2
        sections:
          contact:
            type: fields
            label: Kontaktdaten
            fields:
              phone:
                label: Mobil Telefonnummer
                type: tel
              whatsapp:
                label: WhatsApp Nummer
                type: tel
              email:
                label: E-Mail
                type: email
              phone_line:
                label: Telefonnummer
                type: tel

  social:
    label: Social Media
    icon: share
    sections:
      social:
        type: fields
        fields:
          social_links:
            label: Social Media Links
            type: structure
            max: 4
            help: Maximal 4 Social-Links möglich
            fields:
              icon:
                label: Icon
                type: files
                placeholder: z.B. instagram, facebook, tiktok
              text:
                label: Anzeigename
                type: text
                placeholder: z.B. Instagram
              link:
                label: URL
                type: url
              icon_mobile:
                label: Icon Mobile (Header)
                type: files
                placeholder: z.B. instagram, facebook, tiktok

  areas:
    label: Einzugsgebiete
    icon: map
    sections:
      areas:
        type: fields
        fields:
          show_service_areas:
            label: Einzugsgebiete anzeigen
            type: toggle
            text:
              - "Ausgeblendet"
              - "Sichtbar"
            default: true

          service_areas:
            label: Einzugsgebiete
            type: tags
            placeholder: z.B. Augsburg, München, Ulm
            help: Mehrere Orte möglich
            when:
              show_service_areas: true
  
  seo:
    label: SEO
    sections:
      meta:
        type: fields
        fields:
          meta_title:
            label: Meta Titel
            type: text
            width: 1/2
          meta_description:
            label: Meta Beschreibung
            type: textarea
            spellcheck: true
            buttons: false
            size: small
            width: 1/2
          meta_img:
            label: Meta Bild
            type: files
            multiple: false
            width: 1/3

  assets:
    label: Assets
    icon: image
    sections:
      icon:
        type: fields
        fields:
          header_icon:
            label: Header Icon
            type: files
            multiple: false
      files:
        type: files
        show: true
