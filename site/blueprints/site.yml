title: Site

tabs:
  pages:
    label: Seiten
    icon: page
    sections:
      pages:
        type: pages
        label: Seiten

  settings:
    label: Einstellungen
    icon: cog
    columns:
      left:
        width: 1/2
        sections:
          address:
            type: fields
            label: Adresse
            fields:
              street:
                label: Straße
                type: text
                width: 2/3
              house_number:
                label: Hausnummer
                type: text
                width: 1/3
              zip:
                label: PLZ
                type: text
                width: 1/3
              city:
                label: Stadt
                type: text
                width: 2/3

      right:
        width: 1/2
        sections:
          contact:
            type: fields
            label: Kontaktdaten
            fields:
              phone:
                label: Telefonnummer
                type: tel
              whatsapp:
                label: WhatsApp Nummer
                type: tel
              email:
                label: E-Mail
                type: email

  social:
    label: Social Media
    icon: share
    sections:
      social:
        type: fields
        fields:
          social_links:
            label: Social Media Links
            type: structure
            max: 4
            help: Maximal 4 Social-Links möglich
            fields:
              icon:
                label: Icon
                type: files
                placeholder: z.B. instagram, facebook, tiktok
              text:
                label: Anzeigename
                type: text
                placeholder: z.B. Instagram
              link:
                label: URL
                type: url

  areas:
    label: Einzugsgebiete
    icon: map
    sections:
      areas:
        type: fields
        fields:
          show_service_areas:
            label: Einzugsgebiete anzeigen
            type: toggle
            text:
              - "Ausgeblendet"
              - "Sichtbar"
            default: true

          service_areas:
            label: Einzugsgebiete
            type: tags
            placeholder: z.B. Augsburg, München, Ulm
            help: Mehrere Orte möglich
            when:
              show_service_areas: true
