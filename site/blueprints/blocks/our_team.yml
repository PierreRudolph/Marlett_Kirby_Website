title: Unser Team
name: our_team
icon: grid
preview: false

fields:
  # -------------------------------------------------
  # SECTION
  # -------------------------------------------------
  section:
    label: Sektion
    type: headline

  headline_first_half:
    label: Headline – erste Hälfte
    type: text

  headline_second_half:
    label: Headline – zweite Hälfte
    type: text

  section_id:
    label: Section ID
    type: text

  ratio:
    label: Seitenverhältnis
    type: select
    placeholder: Auto
    options:
      auto: Auto
      1/1: "1:1"
      16/9: "16:9"
      4/3: "4:3"

  crop:
    label: Zuschneiden
    type: toggle

  # -------------------------------------------------
  # CARDS
  # -------------------------------------------------
  cards:
    label: Karten
    type: structure
    max: 4
    columns:
      headline: Headline
      text: Text
    fields:
      first_name:
        label: Vorname
        type: text

      name:
        label: Nachname (ohne einzufärbenden Teil)
        type: text

      name_colored_part:
        label: Nachname (Hellblau eingefärbter Teil)
        type: text

      text:
        label: Text
        type: textarea
        size: small

      img:
        label: Bild
        query: site.files
        type: files
        mulitple: false
