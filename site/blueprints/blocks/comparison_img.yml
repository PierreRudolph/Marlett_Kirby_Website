name: comparison_img
icon: images
preview: fields

fields:
  images:
    label: Bilder
    type: files
    query: model.images
    multiple: true
    max: 2
    layout: cards
    uploads:
      template: blocks/image

  ratio:
    label: Seitenverhältnis
    type: select
    placeholder: Auto
    options:
      auto: Auto
      1/1: "1:1"
      16/9: "16:9"
      4/3: "4:3"

  crop:
    label: Zuschneiden
    type: toggle
