title: Leistung Overview
icon: grid

columns:
  left:
    width: 2/3
    sections:
      published:
        label: Veröffentlicht
        type: pages
        status: listed
        templates: 
          - leistung_single 
          - coaching_overview 
        image:
          back: "#011B28"  
          cover: true
          ratio: 1/1
        layout: cards

      drafts:
        label: Entwürfe
        type: pages
        status: draft
        templates: 
          - leistung_single 
          - coaching_overview  
        image:
          back: "#011B28"  
          cover: true
          ratio: 1/1
        layout: cards

        left_content:
        type: fields
        fields:
          leistungen:
            label: Leistungen
            type: headline
          section_headline:
            label: Sektions-Überschrift
            type: text   
          headline:
            label: Überschrift
            type: text 
          coaching:
            label: Coaching
            type: headline
          coaching_section_headline:
            label: Coaching Sektions-Überschrift
            type: text   
          coaching_headline:
            label: Coaching Überschrift
            type: text 
          coaching_text:
            label: Coaching Text
            type: textarea   
          btn_text:
            label: Button-Text
            type: text   
          btn_link:
            label: Button-Link
            type: link     
          img:
            label: Bild
            type: files   
          blocks:
              type: blocks
              label: Blöcke
              fieldsets:
                - headline-text
                - text-bild
                - case-section
                - call-to-action
    


  right:
    width: 1/3
    sections:
      right_content:
        type: fields
        fields:
          meta_title:
            label: Meta Titel
            type: text
          meta_description:
            label: Meta Beschreibung
            type: textarea
            spellcheck: true

      media:
        type: files
