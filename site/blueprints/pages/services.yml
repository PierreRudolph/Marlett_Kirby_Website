title: services

options:
  changeStatus: false

sections:
  hero:
    type: fields
    fields:
      hero_headline:
        type: headline
        label: Hero Bereich

      headline_first_half:
        label: Headline (erste Hälfte)
        type: text
        width: 1/2
      headline_second_half:
        label: Headline (zweite Hälfte)
        type: text
        width: 1/2

      text:
        label: Beschreibung
        type: textarea
        size: small
        width: 2/3

      img:
        label: Bild
        query: site.files
        type: files
        multiple: false
        width: 1/3
      buttons_headline:
        type: headline
        label: Buttons

      button_contact_text:
        label: Kontakt-Button Text
        type: text
        width: 1/3

      button_phone_text:
        label: Telefon-Button Text
        type: text
        width: 1/3

      button_phone_number:
        label: Telefonnummer
        type: tel
        width: 1/3
      page_meta:
        label: Meta JSON
        type: textarea
        site: big
  services_subpages:
    type: pages
    label: Unterseiten Services bearbeiten
    fields:
      subpage_blocks:
        label: Inhalte der Unterseiten
        type: pages
        query: site.find('leistungen').children
        pretty: true

  builder:
    type: fields
    fields:
      blocks:
        label: Seiten-Inhalte
        type: blocks
        pretty: true
